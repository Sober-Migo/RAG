name: Sync to Hugging Face Hub
on:
  push:
    branches: [main]
jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to Hugging Face
        uses: huggingface/hub-sync-action@v1
        with:
          github_repo_id: https://github.com/Sober-Migo/RAG.git
          huggingface_repo_id: https://huggingface.co/spaces/Sober-Migo/RAG
          hf_token: ${{ secrets.HF_TOKEN }}
